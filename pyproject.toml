[project]
name = "bcb-microdados-fetcher"
version = "0.5.0"
description = "Coletor e conversor Lake Hive de microdados do Banco Central (SCR, ESTBAN, COSIF)"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["bcb-microdados", "quantilica", "dados-abertos", "lake", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.19.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/bcb-microdados-fetcher"
Repository = "https://github.com/Quantilica/bcb-microdados-fetcher"
Issues = "https://github.com/Quantilica/bcb-microdados-fetcher/issues"

[project.scripts]
bcb-microdados-fetcher = "bcb_microdados_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
bcb-microdados = "bcb_microdados_fetcher.plugin:app"


[project.entry-points."quantilica.lake"]
bcb-microdados = "bcb_microdados_fetcher.lake:converter"


[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov",
    "quantilica-cli>=0.17.0",
    "quantilica-core[docs]>=0.19.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.uv.sources]
# O índice Quantilica (GitHub Pages) responde 503 intermitente a pacotes que não
# hospeda. Como índice explícito, o uv só o consulta para os pacotes ligados a
# ele aqui (os do ecossistema que não estão no PyPI); o resto vem só do PyPI.
# Pacote Quantilica novo que só exista no índice entra nesta lista.
quantilica-analytics = { index = "quantilica" }

[[tool.uv.index]]
name = "quantilica"
url = "https://index.quantilica.com/simple/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/bcb_microdados_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]

[tool.coverage.run]
source = ["bcb_microdados_fetcher"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
